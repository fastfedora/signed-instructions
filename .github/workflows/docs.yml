name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the project with the doc group (quarto-cli, griffe, panflute)
        run: |
          uv python install 3.12
          uv sync --group doc
      - name: Generate the API reference pages
        run: uv run python scripts/gen_quarto_api.py
      - name: Render the site
        run: PATH="$PWD/.venv/bin:$PATH" quarto render docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
